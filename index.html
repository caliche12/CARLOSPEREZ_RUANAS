/* ===== Lógica / Logic ===== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const loc={de:'de-DE',en:'en-GB',es:'es-ES'};
let lang,cart={};try{cart=JSON.parse(store.get('cart'))||{}}catch(e){}
const t=k=>T[lang][k]??T.en[k]??k;
const fmt=n=>new Intl.NumberFormat(loc[lang],{style:'currency',currency:CONFIG.currency}).format(n);
$('#grid').innerHTML=P.map(p=>`<article class="card rv"><figure class="ph" style="--c1:${p.a};--c2:${p.b}"><img src="assets/img/ruana-${p.id}.jpg" loading="lazy" width="800" height="1000" alt="" data-alt="p${p.id}.n" onerror="this.remove()">${p.fav?'<span class="tag" data-i18n="fav"></span>':''}</figure><div class="cb"><h3 data-i18n="p${p.id}.n"></h3><p class="sub" data-i18n="p${p.id}.s"></p><p data-i18n="p${p.id}.d"></p><div class="row"><b class="price" data-price="${p.id}"></b><button class="btn sm" data-add="${p.id}" data-i18n="add"></button></div></div></article>`).join('');
$('#soc').innerHTML=Object.entries(CONFIG.social).map(([n,u])=>`<li><a href="${u}" target="_blank" rel="noopener noreferrer">${n}</a></li>`).join('');
function setLang(l){
 lang=T[l]?l:CONFIG.defaultLang;store.set('lang',lang);document.documentElement.lang=lang;
 $$('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
 $$('[data-i18n-aria]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.i18nAria)));
 $$('[data-alt]').forEach(e=>e.alt=t(e.dataset.alt));
 $$('[data-price]').forEach(e=>e.textContent=fmt(CONFIG.prices[e.dataset.price]));
 document.title=t('meta.title');$('meta[name=description]').content=t('meta.desc');
 $('meta[property="og:title"]').content=t('meta.title');$('meta[property="og:description"]').content=t('meta.desc');
 const m=$('#mail');m.textContent=CONFIG.email;m.href='mailto:'+CONFIG.email;
 $('#lang').value=lang;renderCart();
}
function renderCart(){
 const ids=Object.keys(cart).filter(i=>cart[i]>0),n=ids.reduce((s,i)=>s+cart[i],0);
 $('#cnt').textContent=n;$('#cnt').hidden=!n;
 $('#items').innerHTML=ids.length?ids.map(i=>`<li><div><b>${t('p'+i+'.n')}</b><br>${fmt(CONFIG.prices[i])}</div><div class="qty"><button data-q="${i}" data-d="-1" aria-label="−">−</button><span>${cart[i]}</span><button data-q="${i}" data-d="1" aria-label="+">+</button></div></li>`).join(''):`<li>${t('cart.empty')}</li>`;
 $('#total').textContent=fmt(ids.reduce((s,i)=>s+cart[i]*CONFIG.prices[i],0));
 $('#go').disabled=!n;store.set('cart',JSON.stringify(cart));
}
const toggleCart=o=>{document.body.classList.toggle('co',o);if(o)$('#cx').focus();else $('#cb').focus()};
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-add]'),q=e.target.closest('[data-q]');
 if(a){cart[a.dataset.add]=(cart[a.dataset.add]||0)+1;renderCart();toggleCart(true)}
 if(q){cart[q.dataset.q]=Math.max(0,(cart[q.dataset.q]||0)+ +q.dataset.d);renderCart()}
 if(e.target.closest('#nav a'))closeMenu();
});
function closeMenu(){$('#nav').classList.remove('open');$('#bg').setAttribute('aria-expanded','false')}
$('#bg').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o)};
$('#cb').onclick=()=>toggleCart(true);$('#cx').onclick=$('#ov').onclick=()=>toggleCart(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){toggleCart(false);closeMenu()}});
$('#lang').onchange=e=>setLang(e.target.value);
$('#go').onclick=()=>{
 const ids=Object.keys(cart).filter(i=>cart[i]>0);if(!ids.length)return;
 const body=t('mail.h')+'\n\n'+ids.map(i=>`${cart[i]} × ${t('p'+i+'.n')} – ${fmt(CONFIG.prices[i])}`).join('\n')+'\n\n'+t('cart.total')+': '+$('#total').textContent;
 location.href='mailto:'+CONFIG.email+'?subject='+encodeURIComponent(t('mail.s')+' – Ruanas de Nobsa')+'&body='+encodeURIComponent(body);
};
const qp=new URLSearchParams(location.search).get('lang');
setLang([qp,store.get('lang'),CONFIG.defaultLang].find(l=>T[l]));
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});$$('.rv').forEach(el=>io.observe(el))}else $$('.rv').forEach(el=>el.classList.add('in'));
</script>
